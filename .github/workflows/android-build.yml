name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true   # si tu n'as pas de wrapper, on peut le générer

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon
      # Si le wrapper n'existe pas, on peut utiliser la commande suivante pour le générer à la volée :
      # run: gradle wrapper --gradle-version 8.5 && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk