name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '7.6'    # Version compatible avec la plupart des projets Android

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon
        # Pas de wrapper, on utilise directement la commande "gradle" installée

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StandByMode-APK
          path: app/build/outputs/apk/debug/app-debug.apk